name: Publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/jellyfin-poster-manager
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: poster-manager:smoke

      - name: Smoke test startup, volumes, and Selenium as Unraid user
        timeout-minutes: 3
        run: |
          set -euo pipefail
          trap 'docker volume rm smoke-data smoke-cache smoke-logs' EXIT
          for persisted in 0 1; do
            docker run --rm --network none \
              -e WEB_PORT=5087 \
              -e APP_STATE_DIR=/app/data -e CACHE_DIR=/app/cache -e LOG_DIR=/app/logs \
              -e SMOKE_EXPECT_PERSISTED="$persisted" \
              -v smoke-data:/app/data -v smoke-cache:/app/cache -v smoke-logs:/app/logs \
              -v "$PWD/tests/container_smoke.py:/container_smoke.py:ro" \
              poster-manager:smoke python /container_smoke.py
          done

      - name: Publish tested image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
